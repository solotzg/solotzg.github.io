<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">TiFlash learner read consistency</title>
  <desc id="desc">A TiFlash learner read first checks SafeTS, otherwise requests ReadIndex from the TiKV leader, waits for local apply, validates locks and region metadata, then reads DeltaMerge.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; rx: 12; }
      .client { fill: #ecfeff; stroke: #0891b2; }
      .leader { fill: #eff6ff; stroke: #2563eb; }
      .learner { fill: #f8fafc; stroke: #475569; }
      .storage { fill: #f0fdf4; stroke: #16a34a; }
      .check { fill: #fff7ed; stroke: #ea580c; }
      .diamond { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
      .arrow-dashed { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .boundary { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 8 8; rx: 18; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="640"/>
  <text class="title" x="40" y="48">TiFlash Learner Read Consistency</text>

  <rect class="boundary" x="35" y="105" width="230" height="450"/>
  <text class="lane-title" x="58" y="134">Client / TiDB</text>

  <rect class="boundary" x="295" y="105" width="550" height="450"/>
  <text class="lane-title" x="318" y="134">TiFlash Learner</text>
  <text class="tiny" x="318" y="156">Does not participate in Raft quorum</text>

  <rect class="boundary" x="875" y="105" width="265" height="205"/>
  <text class="lane-title" x="898" y="134">TiKV Leader</text>
  <text class="tiny" x="898" y="156">Owns current Raft context</text>

  <rect class="boundary" x="875" y="345" width="265" height="240"/>
  <text class="lane-title" x="898" y="374">DeltaMerge</text>
  <text class="tiny" x="898" y="396">Columnar MVCC snapshot</text>

  <rect class="box client" x="65" y="255" width="170" height="76"/>
  <text class="label" x="150" y="287" text-anchor="middle">Region read</text>
  <text class="small" x="150" y="310" text-anchor="middle">@ start_ts</text>

  <rect class="box learner" x="325" y="238" width="170" height="110"/>
  <text class="label" x="410" y="272" text-anchor="middle">Build Region</text>
  <text class="label" x="410" y="294" text-anchor="middle">snapshot</text>
  <text class="small" x="410" y="321" text-anchor="middle">identity + range</text>

  <path class="diamond" d="M 620 235 L 740 293 L 620 351 L 500 293 Z"/>
  <text class="label" x="620" y="286" text-anchor="middle">SafeTS</text>
  <text class="label" x="620" y="308" text-anchor="middle">&gt;= start_ts?</text>

  <rect class="box leader" x="920" y="205" width="170" height="84"/>
  <text class="label" x="1005" y="236" text-anchor="middle">ReadIndex</text>
  <text class="small" x="1005" y="260" text-anchor="middle">with start_ts</text>

  <rect class="box learner" x="515" y="420" width="190" height="86"/>
  <text class="label" x="610" y="453" text-anchor="middle">Wait local apply</text>
  <text class="small" x="610" y="477" text-anchor="middle">&gt;= read_index</text>

  <rect class="box check" x="750" y="420" width="185" height="86"/>
  <text class="label" x="842.5" y="451" text-anchor="middle">Check locks</text>
  <text class="small" x="842.5" y="475" text-anchor="middle">at start_ts</text>

  <rect class="box check" x="970" y="420" width="150" height="70"/>
  <text class="label" x="1045" y="446" text-anchor="middle">Validate</text>
  <text class="small" x="1045" y="468" text-anchor="middle">epoch / range</text>
  <text class="small" x="1045" y="486" text-anchor="middle">GC safepoint</text>

  <rect class="box storage" x="920" y="515" width="170" height="58"/>
  <text class="label" x="1005" y="539" text-anchor="middle">Read</text>
  <text class="small" x="1005" y="559" text-anchor="middle">DeltaMerge snapshot</text>

  <rect class="box client" x="65" y="430" width="170" height="78"/>
  <text class="label" x="150" y="462" text-anchor="middle">Rows</text>
  <text class="small" x="150" y="486" text-anchor="middle">or retryable error</text>

  <path class="arrow" d="M 235 293 L 318 293"/>
  <path class="arrow" d="M 495 293 L 500 293"/>
  <path class="arrow-blue" d="M 730 270 C 800 215, 850 210, 913 232"/>
  <text class="small" x="785" y="210" text-anchor="middle">No: ask leader</text>
  <path class="arrow-blue" d="M 920 265 C 845 330, 745 350, 675 419"/>
  <text class="small" x="785" y="356" text-anchor="middle">read_index</text>
  <path class="arrow" d="M 620 351 L 620 412"/>
  <text class="small" x="657" y="386">Yes: skip ReadIndex</text>
  <path class="arrow" d="M 705 463 L 742 463"/>
  <path class="arrow" d="M 935 463 L 962 463"/>
  <path class="arrow" d="M 1045 490 L 1045 508"/>
  <path class="arrow" d="M 920 544 C 735 590, 365 570, 235 477"/>

  <path class="arrow-dashed" d="M 1005 420 L 1005 405"/>
</svg>

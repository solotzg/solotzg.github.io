<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TiFlash distributed architecture</title>
  <desc id="desc">A compact diagram showing the relationship between table keyspace, Regions, Raft groups, TiKV Raft peers, and TiFlash learner-only peers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .title { font: 700 25px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 17px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .small { font: 12px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .chipText { font: 700 13px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .storeText { font: 700 12px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #1e293b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .brace { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; }
      .r1 { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.2; rx: 5; }
      .r2 { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.2; rx: 5; }
      .r3 { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.2; rx: 5; }
      .r4 { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.2; rx: 5; }
      .kv { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.2; rx: 5; }
      .tf { fill: #ccfbf1; stroke: #14b8a6; stroke-width: 1.2; rx: 5; }
      .empty { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>
  <text class="title" x="48" y="48">TiFlash 分布式存储：Table、Region 与副本</text>

  <rect class="panel" x="48" y="78" width="1184" height="104"/>
  <text class="label" x="78" y="114">Table 101</text>
  <text class="small" x="78" y="140">Schema snapshot</text>
  <rect class="soft" x="228" y="104" width="140" height="42"/>
  <text class="chipText" x="265" y="130">handle</text>
  <rect class="soft" x="382" y="104" width="100" height="42"/>
  <text class="chipText" x="420" y="130">c1</text>
  <rect class="soft" x="496" y="104" width="100" height="42"/>
  <text class="chipText" x="534" y="130">c2</text>
  <rect class="soft" x="610" y="104" width="100" height="42"/>
  <text class="chipText" x="648" y="130">...</text>
  <text class="small" x="934" y="116">TIFLASH REPLICA 2</text>
  <text class="tiny" x="934" y="140">logical table-level intent</text>

  <path class="arrow" d="M 640 182 L 640 220"/>

  <rect class="panel" x="48" y="220" width="1184" height="134"/>
  <text class="label" x="78" y="258">Table keyspace</text>
  <text class="small" x="78" y="282">split into Regions</text>
  <rect class="r1" x="250" y="254" width="170" height="48"/>
  <rect class="r2" x="420" y="254" width="170" height="48"/>
  <rect class="r3" x="590" y="254" width="170" height="48"/>
  <rect class="r4" x="760" y="254" width="170" height="48"/>
  <text class="chipText" x="317" y="283">R1</text>
  <text class="chipText" x="487" y="283">R2</text>
  <text class="chipText" x="657" y="283">R3</text>
  <text class="chipText" x="827" y="283">R4</text>
  <text class="tiny" x="252" y="326">[k0, k25)</text>
  <text class="tiny" x="422" y="326">[k25, k50)</text>
  <text class="tiny" x="592" y="326">[k50, k75)</text>
  <text class="tiny" x="762" y="326">[k75, k100)</text>
  <text class="small" x="1000" y="270">split / merge</text>
  <text class="tiny" x="1000" y="292">changes boundaries</text>

  <path class="arrow" d="M 640 354 L 640 392"/>

  <rect class="panel" x="48" y="392" width="1184" height="150"/>
  <text class="label" x="78" y="428">Region = Raft Group</text>
  <text class="small" x="78" y="452">read unit</text>

  <rect class="soft" x="250" y="420" width="170" height="74"/>
  <rect class="r1" x="270" y="438" width="48" height="26"/>
  <text class="chipText" x="285" y="456">R1</text>
  <rect class="kv" x="330" y="438" width="62" height="26"/>
  <text class="storeText" x="341" y="456">KV peer</text>
  <rect class="empty" x="330" y="470" width="62" height="18"/>
  <text class="tiny" x="344" y="483">No TF</text>

  <rect class="soft" x="440" y="420" width="170" height="74"/>
  <rect class="r2" x="460" y="438" width="48" height="26"/>
  <text class="chipText" x="475" y="456">R2</text>
  <rect class="kv" x="520" y="438" width="62" height="26"/>
  <text class="storeText" x="531" y="456">KV peer</text>
  <rect class="tf" x="520" y="470" width="62" height="18"/>
  <text class="tiny" x="529" y="483">TF learner</text>

  <rect class="soft" x="630" y="420" width="170" height="74"/>
  <rect class="r3" x="650" y="438" width="48" height="26"/>
  <text class="chipText" x="665" y="456">R3</text>
  <rect class="kv" x="710" y="438" width="62" height="26"/>
  <text class="storeText" x="721" y="456">KV peer</text>
  <rect class="tf" x="710" y="470" width="62" height="18"/>
  <text class="tiny" x="719" y="483">TF learner</text>

  <rect class="soft" x="820" y="420" width="170" height="74"/>
  <rect class="r4" x="840" y="438" width="48" height="26"/>
  <text class="chipText" x="855" y="456">R4</text>
  <rect class="kv" x="900" y="438" width="62" height="26"/>
  <text class="storeText" x="911" y="456">KV peer</text>
  <rect class="tf" x="900" y="470" width="62" height="18"/>
  <text class="tiny" x="909" y="483">TF learner</text>

  <text class="small" x="1018" y="438">per-Region checks</text>
  <text class="tiny" x="1018" y="462">ReadIndex / SafeTS</text>
  <text class="tiny" x="1018" y="482">epoch / range / lock</text>

  <path class="arrow" d="M 640 542 L 640 580"/>

  <rect class="panel" x="48" y="580" width="560" height="92"/>
  <text class="label" x="78" y="616">TiKV stores</text>
  <text class="small" x="78" y="640">leader / follower / learner</text>
  <rect class="kv" x="226" y="608" width="72" height="28"/>
  <text class="storeText" x="242" y="627">Store 1</text>
  <rect class="kv" x="314" y="608" width="72" height="28"/>
  <text class="storeText" x="330" y="627">Store 2</text>
  <rect class="kv" x="402" y="608" width="72" height="28"/>
  <text class="storeText" x="418" y="627">Store 3</text>
  <rect class="kv" x="490" y="608" width="72" height="28"/>
  <text class="storeText" x="506" y="627">Store 4</text>
  <path class="brace" d="M 226 652 C 312 668, 476 668, 562 652"/>

  <rect class="panel" x="672" y="580" width="560" height="92"/>
  <text class="label" x="702" y="616">TiFlash stores</text>
  <text class="small" x="702" y="640">learner peers</text>
  <rect class="tf" x="858" y="608" width="74" height="28"/>
  <text class="storeText" x="874" y="627">Store 5</text>
  <rect class="r2" x="946" y="608" width="42" height="28"/>
  <text class="chipText" x="958" y="627">R2</text>
  <rect class="r3" x="998" y="608" width="42" height="28"/>
  <text class="chipText" x="1010" y="627">R3</text>
  <rect class="tf" x="858" y="646" width="74" height="18"/>
  <text class="tiny" x="880" y="659">DM</text>
  <rect class="tf" x="1062" y="608" width="74" height="28"/>
  <text class="storeText" x="1078" y="627">Store 6</text>
  <rect class="r2" x="1148" y="608" width="42" height="28"/>
  <text class="chipText" x="1160" y="627">R2</text>
  <rect class="r4" x="1148" y="646" width="42" height="18"/>
  <text class="tiny" x="1161" y="659">R4</text>

  <rect class="soft" x="48" y="684" width="1184" height="1"/>
  <rect class="r1" x="78" y="696" width="22" height="14"/><text class="tiny" x="108" y="707">Region</text>
  <rect class="kv" x="174" y="696" width="22" height="14"/><text class="tiny" x="204" y="707">TiKV Raft peer</text>
  <rect class="tf" x="304" y="696" width="22" height="14"/><text class="tiny" x="334" y="707">TiFlash learner only</text>
</svg>

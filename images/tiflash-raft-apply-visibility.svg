<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">TiFlash Raft apply visibility order</title>
  <desc id="desc">Raft apply must make committed versions visible in DeltaMerge before clearing local locks and advancing the applied index.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .stage { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; rx: 7; }
      .raft { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.3; rx: 7; }
      .cache { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.3; rx: 7; }
      .dm { fill: #ccfbf1; stroke: #14b8a6; stroke-width: 1.3; rx: 7; }
      .guard { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.3; rx: 7; }
      .title { font: 700 24px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .small { font: 12px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px "Inter", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .bar { stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="520"/>
  <text class="title" x="44" y="48">Raft Apply 与事务可见性顺序</text>
  <text class="text" x="44" y="74">核心约束：提交版本先进入列存可见状态，再清理本地 lock，最后推进 applied index。</text>

  <rect class="panel" x="44" y="106" width="1092" height="184"/>
  <rect class="raft" x="76" y="152" width="154" height="72"/>
  <text class="label" x="108" y="181">Raft log</text>
  <text class="small" x="100" y="204">ordered commands</text>

  <path class="arrow" d="M 230 188 L 284 188"/>

  <rect class="cache" x="284" y="134" width="176" height="108"/>
  <text class="label" x="314" y="164">Region cache</text>
  <text class="small" x="314" y="188">DEFAULT / LOCK</text>
  <line class="bar" x1="314" y1="202" x2="430" y2="202"/>
  <text class="tiny" x="314" y="222">keep lock before row is visible</text>

  <path class="arrow" d="M 460 188 L 514 188"/>

  <rect class="stage" x="514" y="134" width="170" height="108"/>
  <text class="label" x="548" y="164">WRITE CF</text>
  <text class="small" x="548" y="188">commit record</text>
  <line class="bar" x1="548" y1="202" x2="650" y2="202"/>
  <text class="tiny" x="548" y="222">find value by start_ts</text>

  <path class="arrow" d="M 684 188 L 738 188"/>

  <rect class="dm" x="738" y="134" width="176" height="108"/>
  <text class="label" x="770" y="164">DeltaMerge</text>
  <text class="small" x="770" y="188">committed version visible</text>
  <line class="bar" x1="770" y1="202" x2="878" y2="202"/>
  <text class="tiny" x="770" y="222">columnar snapshot can see it</text>

  <path class="arrow" d="M 914 188 L 968 188"/>

  <rect class="cache" x="968" y="134" width="138" height="108"/>
  <text class="label" x="998" y="164">Clean up</text>
  <text class="small" x="998" y="188">clear local lock</text>
  <line class="bar" x1="998" y1="202" x2="1076" y2="202"/>
  <text class="tiny" x="998" y="222">applied index</text>

  <rect class="panel" x="44" y="324" width="520" height="118"/>
  <text class="label" x="76" y="360">Safe order</text>
  <text class="text" x="76" y="386">WRITE CF -> DeltaMerge -> clear local lock -> applied index</text>
  <text class="small" x="76" y="414">Crash can replay or retry. Read path may see lock, but will not miss a committed row.</text>

  <rect class="guard" x="616" y="324" width="520" height="118"/>
  <text class="label" x="648" y="360">Unsafe shortcut</text>
  <text class="text" x="648" y="386">clear lock before DeltaMerge visibility</text>
  <text class="small" x="648" y="414">A concurrent read may see no lock and still miss the committed version.</text>

  <path class="dash" d="M 840 242 C 840 278, 420 278, 420 324"/>
  <text class="tiny" x="576" y="278">visibility boundary observed by reads</text>
</svg>
